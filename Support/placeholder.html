<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitals</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f3ef; --fg: #1d1d1f; --mute: #77756f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #f2f2f2; --mute: #9a9a9e; } }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px -apple-system, system-ui, sans-serif; }
  main { padding: 20px 22px; }
  h1 { font-size: 17px; margin: 0 0 6px; }
  p { color: var(--mute); margin: 0 0 12px; }
  pre { font: 11px ui-monospace, Menlo, monospace; white-space: pre-wrap; max-height: 70vh; overflow: auto; }
</style></head>
<body><main>
  <h1>Vitals</h1>
  <p>Placeholder page: the real pages (Resources/*.html) aren't in this build yet.</p>
  <pre id="out">Waiting for the first snapshot…</pre>
</main>
<script>
  var Vitals = {
    update: function (s) {
      var m = s.memory || {}, G = 1073741824;
      document.getElementById("out").textContent =
        "Memory pressure " + m.pressurePct + "% (" + m.level + ")\n" +
        "Swap " + (m.swapUsedBytes / G).toFixed(2) + " of " + (m.swapTotalBytes / G).toFixed(2) + " GB\n" +
        "CPU " + (s.cpu || {}).totalPct + "%\n" +
        "Processes " + (s.totals || {}).processes + "\n\n" +
        (s.processes || []).slice(0, 8).map(function (p) { return p.name + "  " + ((p.memBytes || 0) / G).toFixed(2) + " GB"; }).join("\n");
    },
    scrollTo: function () {}
  };
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.vitals) {
    window.webkit.messageHandlers.vitals.postMessage({ action: "ready" });
  }
</script>
</body></html>
