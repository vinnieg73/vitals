<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitals</title>
<link rel="stylesheet" href="app.css">
<style>
body{background:var(--menu);padding:6px;font-size:13px;overflow:hidden;min-width:340px}
.w{color:var(--warn)!important}
.c{color:var(--crit)!important}
.pscope{border-radius:8px;background:var(--scope);box-shadow:inset 0 0 0 .5px var(--line)}
.pch{display:grid;grid-template-columns:minmax(0,1fr) 128px;height:52px;border-top:1px solid var(--line-2)}
.pch:first-child{border-top:0}
.pch .plot{position:relative;min-width:0}
.pch .lab{position:absolute;left:8px;top:5px;font-size:10.5px;font-weight:600;color:var(--ink-2);z-index:2;text-shadow:0 0 3px var(--scope),0 0 3px var(--scope)}
.pch .pr{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding-right:10px;gap:3px;min-width:0}
.pch .pr b{font-size:17px;font-weight:600;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.pch .pr b small{font-size:11px;font-weight:500;color:var(--ink-3);margin-left:1px;letter-spacing:0}
.pch .pr b.w small{color:var(--warn)}.pch .pr b.c small{color:var(--crit)}
.pch .pr span{font-size:11px;color:var(--ink-3);white-space:nowrap}
.pch .pr .r2{font-size:12.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink);display:flex;align-items:baseline;gap:4px}
.pch .pr .r2 small{font-size:10.5px;font-weight:500;color:var(--ink-3)}
.pch .pr .r2 i{font-style:normal;font-size:7.5px;color:var(--ink-3)}
.paxis{position:relative;height:18px;font-size:10px;color:var(--ink-3);margin-right:128px}
.paxis span{position:absolute;top:3px}
.paxis span.l{left:8px}
.paxis span.r{right:0;transform:translateX(50%)}
.sec{padding:9px 10px 4px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px;padding:3px 10px 4px}
.top .tn{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden}
.top .tn span{overflow:hidden;text-overflow:ellipsis}
.top .tb2{grid-column:1 / -1;height:3px;border-radius:2px;background:var(--track);margin-top:4px;overflow:hidden}
.top .tb2 i{display:block;height:100%;background:var(--g2)}
hr{border:0;border-top:1px solid var(--line);margin:5px 10px}
.mi{display:flex;justify-content:space-between;padding:4px 10px;border-radius:6px;cursor:default}
.mi:hover{background:var(--sel-strong)}
.mi kbd{font:inherit;color:var(--ink-3)}
</style>
</head>
<body>
<div class="pscope" id="pscope">
  <div class="pch"><div class="plot"><span class="lab">Memory</span></div><div class="pr" id="r-mem"></div></div>
  <div class="pch"><div class="plot"><span class="lab">CPU</span></div><div class="pr" id="r-cpu"></div></div>
  <div class="pch"><div class="plot"><span class="lab">GPU</span></div><div class="pr" id="r-gpu"></div></div>
  <div class="pch"><div class="plot"><span class="lab">Disk</span></div><div class="pr" id="r-disk"></div></div>
  <div class="pch"><div class="plot"><span class="lab">Network</span></div><div class="pr" id="r-net"></div></div>
  <div class="pch"><div class="plot"><span class="lab">Energy</span></div><div class="pr" id="r-energy"></div></div>
</div>
<div class="paxis"><span class="l">5 min</span><span class="r">now</span></div>
<div class="sec">Memory by app</div>
<div id="top5"></div>
<hr>
<div class="mi" data-post="openWindow"><span>Open Vitals</span><kbd>⌘O</kbd></div>
<div class="mi" data-post="openHelp"><span>Help…</span><kbd>⌘?</kbd></div>
<div class="mi" data-post="quitApp"><span>Quit Vitals</span><kbd>⌘Q</kbd></div>

<script src="app.js"></script>
<script>
(function () {
  "use strict";
  var V = Vitals, F = V.F, isNum = V.isNum, $ = function (id) { return document.getElementById(id); };
  var mini = { pad: 4, padTop: 19, mini: true };
  var specs = [
    Object.assign({ type: "level", max: 100 }, mini), Object.assign({ type: "stack", max: 100 }, mini),
    Object.assign({ type: "single", max: 100 }, mini), Object.assign({ type: "mirror", floor: 1e6 }, mini),
    Object.assign({ type: "mirror", floor: 1e5 }, mini), Object.assign({ type: "single", floor: 10 }, mini)
  ];
  var plots = document.querySelectorAll(".pch .plot");
  var strips = specs.map(function (o, i) { return new V.Strip(plots[i], o); });

  function two(a, b) {
    var pa = F.rateParts(a), pb = F.rateParts(b);
    return '<span class="r2"><i>▲</i>' + pa[0] + "<small>" + pa[1] + '</small></span><span class="r2"><i>▼</i>' + pb[0] + "<small>" + pb[1] + "</small></span>";
  }
  function set(id, html) { var el = $(id); if (el.innerHTML !== html) el.innerHTML = html; }
  function top5(s) {
    return V.items(s).map(function (it) { return { name: it.name, bytes: it.memBytes, sessions: it.sessions }; })
      .sort(function (a, b) { return (b.bytes || 0) - (a.bytes || 0); }).slice(0, 5);
  }

  V.onUpdate(function (s) {
    var m = s.memory || {}, c = s.cpu || {}, g = s.gpu || {}, d = s.disk || {}, n = s.network || {}, e = s.energy || {}, h = s.host || {};
    var L = V.liveOf(s), ms = V.memState(s);
    var MS = V.memSev(s, L), data = [[L.memUsedPct], [L.cpuSystemPct, L.cpuUserPct], [L.gpuPct], [L.diskReadBps, L.diskWriteBps], [L.netInBps, L.netOutBps], [V.useWatts(s, L) ? L.powerW : L.energyImpact]];
    strips.forEach(function (st, i) {
      st.size(plots[i].clientWidth, plots[i].clientHeight);
      st.draw(data[i][0], data[i][1], i === 0 && ms !== "ok" ? ms : "", i === 0 ? MS : null);
    });

    var mc = ms === "crit" ? "c" : ms === "warn" ? "w" : "";
    var sc = V.swapCls(s);
    set("r-mem", '<b class="' + mc + '">' + F.pct(V.now(m.totalBytes && isNum(m.usedBytes) ? m.usedBytes / m.totalBytes * 100 : null, L.memUsedPct)) + "<small>% used</small></b>" +
      "<span>RAM " + F.gb(m.usedBytes, 1) + " / " + F.gb(m.totalBytes, 0) + " GB</span>" +
      '<span class="' + sc + '">Swap ' + F.gb(m.swapUsedBytes) + " / " + F.gb(m.swapTotalBytes) + " GB</span>");
    var user = V.now(c.userPct, L.cpuUserPct), sys = V.now(c.systemPct, L.cpuSystemPct);
    var tot = isNum(c.totalPct) ? c.totalPct : isNum(user) && isNum(sys) ? user + sys : null;
    set("r-cpu", "<b>" + F.pct(tot) + "<small>%</small></b><span>User " + F.pct(user, 1) + " · Sys " + F.pct(sys, 1) + "</span>");
    set("r-gpu", "<b>" + F.pct(V.now(g.pct, L.gpuPct)) + "<small>%</small></b>" + (h.gpuCores ? "<span>" + h.gpuCores + " cores</span>" : ""));
    set("r-disk", two(V.now(d.readBps, L.diskReadBps), V.now(d.writeBps, L.diskWriteBps)));
    set("r-net", two(V.now(n.inBps, L.netInBps), V.now(n.outBps, L.netOutBps)));
    // watts with a battery; the energy impact score on Macs without one
    var useW = V.useWatts(s, L), pw = useW ? V.now(e.watts, L.powerW) : V.now(e.impact, L.energyImpact);
    set("r-energy", "<b>" + (isNum(pw) ? pw.toFixed(1) : "–") + (useW ? "<small> W</small>" : "") + "</b><span>" +
      (useW ? "Power draw" : "Energy score") + "</span>" + (isNum(e.batteryPct) ? "<span>Battery " + F.pct(e.batteryPct) + "%</span>" : ""));

    var tot5 = m.totalBytes || h.memBytes || 1;
    set("top5", top5(s).map(function (t) {
      var dots = t.sessions && t.sessions.length ? '<span class="dots">' + t.sessions.map(function (k) { return '<i class="mdot m-' + F.esc(k.model || "") + '"></i>'; }).join("") + "</span>" : "";
      return '<div class="top"><span class="tn"><span>' + F.esc(t.name) + "</span>" + dots + "</span><span>" + F.mem(t.bytes) +
        '</span><span class="tb2"><i style="width:' + Math.min(100, (t.bytes || 0) / tot5 * 100).toFixed(1) + '%"></i></span></div>';
    }).join(""));
  });
  document.addEventListener("keydown", function (e) {
    if (!e.metaKey) return;
    var k = e.key.toLowerCase();
    if (k === "o") { e.preventDefault(); V.post("openWindow"); }
    else if (k === "?" || k === "/") { e.preventDefault(); V.post("openHelp"); }
    else if (k === "q") { e.preventDefault(); V.post("quitApp"); }
  });
})();
</script>
</body>
</html>
