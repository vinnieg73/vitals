<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitals</title>
<link rel="stylesheet" href="app.css">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden;min-width:1040px}
.w{color:var(--warn)!important}
.c{color:var(--crit)!important}

/* ---- top row ---- */
.top{height:46px;flex:none;display:flex;align-items:center;gap:16px;padding:0 14px 0 28px}
.top .host{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:6px;width:232px;height:28px;padding:0 9px;border-radius:7px;background:var(--panel);box-shadow:inset 0 0 0 .5px var(--line);flex:none}
.search svg{flex:none;color:var(--ink-3)}
.search input{border:0;background:transparent;outline:0;flex:1;font:inherit;font-size:12.5px;color:var(--ink);min-width:0;-webkit-user-select:text;user-select:text}
.search input::placeholder{color:var(--ink-3)}

/* ---- strip charts ---- */
.scope{margin:0 14px;border-radius:9px;background:var(--scope);box-shadow:inset 0 0 0 .5px var(--line),0 0 0 .5px var(--line-2);position:relative;flex:none}
.ch{display:grid;grid-template-columns:140px minmax(0,1fr) 474px;height:68px;border-top:1px solid var(--line-2)}
.ch:first-child{border-top:0}
.ch.slim{height:44px}
.ch .nm{padding:11px 0 0 14px;min-width:0}
.ch .nm b{display:block;font-size:12.5px;font-weight:600;letter-spacing:-.005em}
.ch .nm span{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch.slim .nm{padding-top:7px}
.plot{position:relative;min-width:0}
.plot .sc{position:absolute;right:calc(100% + 8px);font-size:10px;color:var(--ink-3);white-space:nowrap;line-height:1}
.ro{display:grid;grid-template-columns:114px minmax(0,1fr) minmax(0,1.05fr);column-gap:22px;align-items:center;padding:0 18px 0 22px;min-width:0}
.ro .big{font-size:25px;font-weight:600;letter-spacing:-.035em;line-height:1;white-space:nowrap}
.ro .big small{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:-.01em;margin-left:1px}
.ro .big.w small{color:var(--warn)}.ro .big.c small{color:var(--crit)}
.ro .bl{font-size:11px;color:var(--ink-3);margin-top:4px;white-space:nowrap}
.ro .two{display:flex;flex-direction:column;gap:5px}
.ro .two div{display:flex;align-items:baseline;gap:6px;font-size:15px;font-weight:600;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.ro .two small{font-size:11.5px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.ro .two .gl{font-size:8px;color:var(--ink-3);width:9px;transform:translateY(-1px)}
.kv{display:grid;grid-template-columns:auto 1fr;column-gap:8px;row-gap:2px;font-size:11.5px;line-height:15px;margin:0;min-width:0}
.kv dt{color:var(--ink-3);white-space:nowrap}
.kv dd{margin:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.kv dd small{color:var(--ink-3);font-size:11px}
.cores{display:flex;align-items:flex-end;gap:2px;height:16px;margin-top:6px}
.cores i{display:block;width:4px;border-radius:1px;background:var(--g3);position:relative;height:16px;overflow:hidden}
.cores i u{position:absolute;left:0;right:0;bottom:0;background:var(--g2)}
.cores .gap{width:3px;background:none}
.axis{position:relative;height:20px;margin:0 14px;font-size:10.5px;color:var(--ink-3);flex:none}
.axis span{position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap}
.axis span.r{transform:translateX(-100%)}
.axis span.l{transform:none}
.hair{position:absolute;top:0;bottom:0;width:1px;background:var(--ink-3);opacity:.55;pointer-events:none;display:none}
.htag{position:absolute;top:3px;pointer-events:none;display:none;font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:4px;background:var(--page);
  box-shadow:0 0 0 .5px var(--line),0 1px 3px rgba(0,0,0,.12);white-space:nowrap;color:var(--ink);z-index:3}
.axis .htime{display:none;top:3px;font-weight:600;color:var(--ink);background:var(--page);padding:0 4px}

/* ---- processes ---- */
.procs{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:2px}
.ph{display:flex;align-items:center;gap:8px;padding:4px 22px 5px 28px;height:32px;flex:none}
.ph h2{margin:0;font-size:13px;font-weight:600}
.ph .n{font-size:12px;color:var(--ink-3)}
.ph .sp{flex:1}
.qbtn{flex:none;border:0;border-radius:6px;height:22px;padding:0 10px;background:var(--panel);box-shadow:inset 0 0 0 .5px var(--line);font-size:12px;cursor:pointer;white-space:nowrap}
.qbtn:hover{background:var(--panel-2)}
.qbtn[disabled]{color:var(--ink-4);cursor:default;background:var(--panel)}
.scroll{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line)}
table.pt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12.5px}
.pt th{position:sticky;top:0;z-index:1;background:var(--page);font-size:11.5px;font-weight:500;color:var(--ink-3);text-align:right;padding:5px 10px;
  white-space:nowrap;box-shadow:inset 0 -1px 0 var(--line);cursor:pointer;overflow:hidden;text-overflow:ellipsis}
.pt th:first-child{text-align:left;padding-left:28px}
.pt th:last-child,.pt td:last-child{text-align:left;padding-left:18px;padding-right:22px}
.pt th .ar{display:inline-block;margin-left:4px;font-size:8px;transform:translateY(-1px)}
.pt th.on{color:var(--ink);font-weight:600}
.pt tr.pad td,.pt tr.pad{padding:0;border:0;background:none}
.pt td{padding:0 10px;height:24px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt tr.odd td{background:var(--zebra)}
.pt tbody tr[data-id]:hover td{background:var(--sel)}
.pt tr.sel td,.pt tr.sel:hover td{background:var(--sel-strong)}
.pt td:first-child{text-align:left;padding-left:12px}
.pt td.z{color:var(--ink-4)}
.pt td.u{color:var(--ink-3)}
.pt td.s{font-weight:500}
.pt .nmc{display:flex;align-items:center;gap:6px;min-width:0}
.pt .nmc .t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pt .chev{width:12px;flex:none;color:var(--ink-3);font-size:9px;cursor:pointer;display:inline-flex;justify-content:center;transition:transform .15s}
.pt .chev.open{transform:rotate(90deg)}
.pt tr.kid .nmc{padding-left:20px}
.foot{height:26px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 22px 0 28px;font-size:11px;color:var(--ink-3);border-top:1px solid var(--line)}

/* ---- confirm sheet ---- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.25);display:flex;align-items:flex-start;justify-content:center;padding-top:120px;z-index:5}
.sheet{width:340px;background:var(--menu);border-radius:12px;box-shadow:var(--shadow);padding:18px 18px 14px}
.sheet h3{margin:0;font-size:15px;font-weight:650}
.sheet p{margin:6px 0 16px;color:var(--ink-2);font-size:13px;line-height:1.4}
.sheet .btns{display:flex;justify-content:flex-end;gap:8px}
.sheet button{border:0;border-radius:7px;height:28px;padding:0 14px;background:var(--panel-2);cursor:pointer}
.sheet button.go{background:var(--ink);color:var(--page);font-weight:600}

@media (max-width:1180px){
  .ch{grid-template-columns:132px minmax(0,1fr) 446px}
  .ro{column-gap:14px;padding:0 12px 0 16px}
  .pt th,.pt td{padding-left:7px;padding-right:7px}
}
</style>
</head>
<body>
<header class="top">
  <span class="host" id="host"></span>
  <span class="sp"></span>
  <label class="search"><svg width="13" height="13" viewBox="0 0 16 16"><circle cx="6.8" cy="6.8" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.6 10.6 14.5 14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="q" placeholder="Search processes" spellcheck="false" autocomplete="off"></label>
</header>

<div class="scope" id="scope">
  <div class="ch" id="ch-mem"><div class="nm"><b>Memory</b><span id="sub-mem"></span></div><div class="plot"></div><div class="ro"></div></div>
  <div class="ch" id="ch-cpu"><div class="nm"><b>CPU</b><span id="sub-cpu"></span><div class="cores" id="cores"></div></div><div class="plot"></div><div class="ro"></div></div>
  <div class="ch slim" id="ch-gpu"><div class="nm"><b>GPU</b><span id="sub-gpu"></span></div><div class="plot"></div><div class="ro"></div></div>
  <div class="ch" id="ch-disk"><div class="nm"><b>Disk</b><span id="sub-disk"></span></div><div class="plot"></div><div class="ro"></div></div>
  <div class="ch" id="ch-net"><div class="nm"><b>Network</b><span id="sub-net"></span></div><div class="plot"></div><div class="ro"></div></div>
  <div class="ch" id="ch-energy"><div class="nm"><b>Energy</b><span id="sub-energy"></span></div><div class="plot"></div><div class="ro"></div></div>
  <div class="hair" id="hair"></div>
</div>
<div class="axis" id="axis"></div>

<section class="procs">
  <div class="ph"><h2>Processes</h2><span class="n" id="pcount"></span><span class="sp"></span><button class="qbtn" id="quitBtn" hidden></button></div>
  <div class="scroll" id="scroll">
    <table class="pt">
      <colgroup><col><col style="width:92px"><col style="width:64px"><col style="width:86px"><col style="width:68px"><col style="width:64px"><col style="width:86px"><col style="width:86px"><col style="width:80px"><col style="width:80px"><col style="width:118px"></colgroup>
      <thead><tr id="ph"></tr></thead>
      <tbody id="pb"></tbody>
    </table>
  </div>
</section>
<footer class="foot"><span id="footL"></span><span id="footR"></span></footer>

<div class="veil" id="veil" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="qTitle">
    <h3 id="qTitle"></h3>
    <p id="qText"></p>
    <div class="btns"><button id="qNo">Cancel</button><button class="go" id="qYes">Quit</button></div>
  </div>
</div>

<script src="app.js"></script>
<script>
(function () {
  "use strict";
  var V = Vitals, F = V.F, $ = function (id) { return document.getElementById(id); };
  var GiB = V.GiB, isNum = V.isNum, CAP = V.CAP;
  var snap = null, L = null, MS = [];

  /* ================= strip charts ================= */
  function u(v, unit) { return v + "<small> " + unit + "</small>"; }
  function kv(rows) {
    return '<dl class="kv">' + rows.filter(Boolean).map(function (r) { return "<dt>" + r[0] + '</dt><dd class="' + (r[2] || "") + '">' + r[1] + "</dd>"; }).join("") + "</dl>";
  }
  function bigOne(v, unit, label, cls) {
    return '<div><div class="big ' + (cls || "") + '">' + v + (unit ? "<small>" + unit + "</small>" : "") + '</div><div class="bl ' + (cls || "") + '">' + label + "</div></div>";
  }
  function bigTwo(a, aLab, b, bLab) {
    var pa = F.rateParts(a), pb = F.rateParts(b);
    return '<div class="two"><div><span class="gl">▲</span>' + pa[0] + "<small>" + pa[1] + " " + aLab + '</small></div><div><span class="gl">▼</span>' +
      pb[0] + "<small>" + pb[1] + " " + bLab + "</small></div></div>";
  }
  function scaleLabel(v, unit) {
    if (unit === "%") return v + "%";
    if (unit === "Bps") { var p = F.rateParts(v); return p[0].replace(/\.0$/, "") + " " + p[1]; }
    return String(+v.toFixed(1));
  }
  function sevCls(st) { return st === "crit" ? "c" : st === "warn" ? "w" : ""; }
  function pctTag(v) { return isNum(v) ? Math.round(v) + "%" : "–"; }
  function pair(a, b) { return F.rate(a) + " · " + F.rate(b); }

  // each channel: chart spec, live series, readout, hover tag
  var CH = [
    { id: "mem", opt: { type: "level", max: 100, pad: 8 }, unit: "%",
      data: function () { return [L.memUsedPct]; },
      tag: function (i) { return pctTag(L.memUsedPct[i]); },
      tagCls: function (i) { return sevCls(MS[i]); } },
    { id: "cpu", opt: { type: "stack", max: 100, pad: 8 }, unit: "%",
      data: function () { return [L.cpuSystemPct, L.cpuUserPct]; },
      tag: function (i) { var a = L.cpuSystemPct[i], b = L.cpuUserPct[i]; return isNum(a) && isNum(b) ? pctTag(a + b) : "–"; } },
    { id: "gpu", opt: { type: "single", max: 100, pad: 6 }, unit: "%",
      data: function () { return [L.gpuPct]; },
      tag: function (i) { return pctTag(L.gpuPct[i]); } },
    { id: "disk", opt: { type: "mirror", floor: 1e6, pad: 8 }, unit: "Bps",
      data: function () { return [L.diskReadBps, L.diskWriteBps]; },
      tag: function (i) { return pair(L.diskReadBps[i], L.diskWriteBps[i]); } },
    { id: "net", opt: { type: "mirror", floor: 1e5, pad: 8 }, unit: "Bps",
      data: function () { return [L.netInBps, L.netOutBps]; },
      tag: function (i) { return pair(L.netInBps[i], L.netOutBps[i]); } },
    { id: "energy", opt: { type: "single", floor: 10, pad: 8 }, unit: "",
      data: function () { return [L.energyImpact]; },
      tag: function (i) { return isNum(L.energyImpact[i]) ? L.energyImpact[i].toFixed(1) : "–"; } }
  ];
  CH.forEach(function (c) {
    var row = $("ch-" + c.id);
    c.plot = row.querySelector(".plot");
    c.ro = row.querySelector(".ro");
    c.strip = new V.Strip(c.plot, c.opt);
    c.scTop = document.createElement("span"); c.scTop.className = "sc";
    c.scBot = document.createElement("span"); c.scBot.className = "sc";
    c.htag = document.createElement("span"); c.htag.className = "htag";
    c.plot.appendChild(c.scTop); c.plot.appendChild(c.scBot); c.plot.appendChild(c.htag);
  });

  var axisBuilt = "";
  function layout() {
    CH.forEach(function (c) { c.strip.size(c.plot.clientWidth, c.plot.clientHeight); });
    var p = CH[0].plot, left = p.offsetLeft, w = p.clientWidth, key = left + "x" + w;
    if (key === axisBuilt) return;
    axisBuilt = key;
    $("axis").innerHTML = ["5 min", "4 min", "3 min", "2 min", "1 min", "now"].map(function (t, k) {
      return '<span class="' + (k === 5 ? "r" : k === 0 ? "l" : "") + '" style="left:' + (left + w * k / 5).toFixed(1) + 'px">' + t + "</span>";
    }).join("") + '<span class="htime" id="htime"></span>';
  }

  function drawCharts(s) {
    L = V.liveOf(s); MS = V.memSev(s, L);
    var ms = V.memState(s);
    layout();
    CH.forEach(function (c) {
      var d = c.data(), st = c.strip;
      st.draw(d[0], d[1], c.id === "mem" ? (ms === "ok" ? "" : ms) : "", c.id === "mem" ? MS : null);
      var lab = scaleLabel(st.max, c.unit);
      if (c.scTop.textContent !== lab) c.scTop.textContent = lab;
      var bl = c.opt.type === "mirror" ? lab : "0";
      if (c.scBot.textContent !== bl) c.scBot.textContent = bl;
      c.scTop.style.top = (st.top - 2) + "px";
      c.scBot.style.top = (st.bot - (c.opt.type === "mirror" ? 8 : 6)) + "px";
    });
    if (hoverX != null) hover(hoverX);
  }

  /* hover: one hairline through every chart, a value tag in each, the time on the axis */
  var hoverX = null;
  function hover(x) {
    var w = CH[0].strip.w, plotLeft = CH[0].plot.offsetLeft;
    if (!L || x < 0 || x > w) { unhover(); return; }
    hoverX = x;
    var slot = Math.round(x / w * (CAP - 1)), px = slot / (CAP - 1) * w;
    var hair = $("hair"); hair.style.display = "block"; hair.style.left = (plotLeft + px).toFixed(1) + "px";
    var secs = (CAP - 1 - slot) * ((L && L.stepSec) || 2), ht = $("htime");
    if (ht) {
      ht.style.display = "block"; ht.style.left = (plotLeft + px).toFixed(1) + "px";
      ht.textContent = secs ? "−" + Math.floor(secs / 60) + ":" + ("0" + secs % 60).slice(-2) : "now";
    }
    CH.forEach(function (c) {
      var i = c.strip.index(px), tg = c.htag;
      if (i < 0) { tg.style.display = "none"; return; }
      tg.textContent = c.tag(i);
      tg.className = "htag " + (c.tagCls ? c.tagCls(i) : "");
      tg.style.display = "block";
      var tw = tg.offsetWidth;
      tg.style.left = (px + 6 + tw > w ? px - 6 - tw : px + 6).toFixed(1) + "px";
    });
  }
  function unhover() {
    hoverX = null;
    $("hair").style.display = "none";
    var ht = $("htime"); if (ht) ht.style.display = "none";
    CH.forEach(function (c) { c.htag.style.display = "none"; });
  }
  $("scope").addEventListener("mousemove", function (e) { hover(e.clientX - CH[0].plot.getBoundingClientRect().left); });
  $("scope").addEventListener("mouseleave", unhover);

  /* readouts at the right */
  function renderReadouts(s) {
    var m = s.memory || {}, c = s.cpu || {}, g = s.gpu || {}, d = s.disk || {}, n = s.network || {}, e = s.energy || {}, h = s.host || {}, t = s.totals || {};
    var ms = V.memState(s), swapCls = V.swapCls(s);

    $("sub-mem").textContent = F.gbShort(m.totalBytes || h.memBytes);
    var used = V.now(m.totalBytes && isNum(m.usedBytes) ? m.usedBytes / m.totalBytes * 100 : null, L.memUsedPct);
    CH[0].ro.innerHTML = bigOne(F.pct(used), "%", "Used · " + F.gb(m.usedBytes) + " GB", sevCls(ms)) +
      kv([["Pressure", u(F.pct(V.now(m.pressurePct, L.pressurePct)), "%"), sevCls(ms)], ["Cached", u(F.gb(m.cachedBytes), "GB")],
        ["Swap", u(F.gb(m.swapUsedBytes), "GB") + "<small> / " + F.gb(m.swapTotalBytes) + "</small>", swapCls]]) +
      kv([["App", u(F.gb(m.appBytes), "GB")], ["Wired", u(F.gb(m.wiredBytes), "GB")], ["Compressed", u(F.gb(m.compressedBytes), "GB")]]);

    var cores = c.cores || [], P = cores.filter(function (k) { return k.kind === "P"; }), E = cores.filter(function (k) { return k.kind !== "P"; });
    var np = P.length || h.pCores, ne = E.length || h.eCores;
    $("sub-cpu").textContent = np || ne ? (np || 0) + " P + " + (ne || 0) + " E cores" : "";
    function bars(a) { return a.map(function (k) { return '<i><u style="height:' + Math.max(0, Math.min(100, k.pct || 0)).toFixed(0) + '%"></u></i>'; }).join(""); }
    $("cores").innerHTML = bars(P) + (P.length && E.length ? '<i class="gap"></i>' : "") + bars(E);
    var user = V.now(c.userPct, L.cpuUserPct), sys = V.now(c.systemPct, L.cpuSystemPct);
    var tot = isNum(c.totalPct) ? c.totalPct : isNum(user) && isNum(sys) ? user + sys : null;
    CH[1].ro.innerHTML = bigOne(F.pct(tot), "%", "Total") +
      kv([["User", u(F.pct(user, 1), "%")], ["System", u(F.pct(sys, 1), "%")], ["Idle", u(F.pct(isNum(c.idlePct) ? c.idlePct : isNum(tot) ? 100 - tot : null, 1), "%")]]) +
      kv([["Load", (c.load || []).map(function (x) { return F.pct(x, 1); }).join("&nbsp; ") || "–"], ["Threads", F.int(t.threads)], ["Processes", F.int(t.processes)]]);

    $("sub-gpu").textContent = h.gpuCores ? h.gpuCores + " cores" : "";
    CH[2].ro.innerHTML = '<div><div class="big">' + F.pct(V.now(g.pct, L.gpuPct)) + "<small>%</small></div></div><div></div><div></div>";

    $("sub-disk").textContent = d.volume || "";
    CH[3].ro.innerHTML = bigTwo(V.now(d.readBps, L.diskReadBps), "read", V.now(d.writeBps, L.diskWriteBps), "write") +
      kv([["Read today", dec(d.readTodayBytes)], ["Written today", dec(d.writtenTodayBytes)],
        ["Swapped out", isNum(m.swapOutBytesSinceBoot) ? u(Math.round(m.swapOutBytesSinceBoot / GiB), "GB") : "–"]]) +
      kv([["Free", dec(d.freeBytes)], ["Used", dec(d.usedBytes)], ["Capacity", dec(d.totalBytes)]]);

    $("sub-net").textContent = n.iface || "";
    CH[4].ro.innerHTML = bigTwo(V.now(n.inBps, L.netInBps), "in", V.now(n.outBps, L.netOutBps), "out") +
      kv([["Packets in/s", F.int(n.packetsInPs)], ["Packets out/s", F.int(n.packetsOutPs)]]) +
      kv([["Received today", dec(n.inTodayBytes)], ["Sent today", dec(n.outTodayBytes)]]);

    var thermal = { nominal: "Nominal", fair: "Fair", serious: "Serious", critical: "Critical" }[e.thermal] || "–";
    var hasBatt = isNum(e.batteryPct);
    $("sub-energy").textContent = e.pluggedIn ? "On power" + (e.adapterWatts ? " · " + e.adapterWatts + " W" : "") : hasBatt ? "On battery" : "";
    var imp = V.now(e.impact, L.energyImpact);
    CH[5].ro.innerHTML = bigOne(isNum(imp) ? imp.toFixed(1) : "–", "", "Energy impact") +
      kv([hasBatt && ["Battery", u(F.pct(e.batteryPct), "%")], hasBatt && ["Time left", isNum(e.minutesLeft) ? F.hm(e.minutesLeft).replace(" min", " m") : "–"], ["Thermal", thermal]]) +
      kv([hasBatt && ["Health", u(F.pct(e.healthPct), "%")], hasBatt && ["Cycles", F.int(e.cycles)],
        isNum(e.fanRPM) && ["Fan", e.fanRPM > 0 ? u(F.int(e.fanRPM), "rpm") : "Off"]]);
  }
  // decimal GB like Finder, number then a quiet unit
  function dec(b) { return isNum(b) ? u((b / 1e9).toFixed(1), "GB") : "–"; }

  /* ================= process table ================= */
  var cols = [
    { k: "name", t: "Process" }, { k: "memBytes", t: "Memory" }, { k: "cpuPct", t: "CPU %" }, { k: "cpuTimeSec", t: "CPU time" },
    { k: "threads", t: "Threads" }, { k: "energy", t: "Energy" }, { k: "diskReadBps", t: "Disk read" }, { k: "diskWriteBps", t: "Disk write" },
    { k: "netInBps", t: "Net in" }, { k: "netOutBps", t: "Net out" }, { k: "user", t: "User" }
  ];
  var sortK = "memBytes", sortDir = -1, query = "", open = {}, selected = null, visible = [];
  function cmp(a, b) {
    var x = a[sortK], y = b[sortK];
    if (sortK === "name" || sortK === "user") {
      if (x == null || y == null) return x == null && y == null ? 0 : x == null ? 1 : -1;   // no user: always last
      return String(x).localeCompare(String(y)) * sortDir;
    }
    return ((x || 0) - (y || 0)) * sortDir;
  }
  function match(p) {
    if (!query) return true;
    return (p.name + " " + V.note(p) + " " + (p.pid == null ? "" : p.pid) + " " + (p.model || "")).toLowerCase().indexOf(query) >= 0;
  }
  function cell(p, k) {
    switch (k) {
      case "memBytes": return F.mem(p.memBytes);
      case "cpuPct": return F.pct(p.cpuPct, 1);
      case "cpuTimeSec": return F.dur(p.cpuTimeSec);
      case "threads": return F.int(p.threads);
      case "energy": return F.pct(p.energy, 1);
      case "diskReadBps": case "diskWriteBps": case "netInBps": case "netOutBps": return F.rate(p[k]);
      case "user": return p.user == null ? "–" : F.esc(p.user);
    }
    return "";
  }
  function dim(p, k) { return /Bps$/.test(k) ? !(p[k] > 0) : k === "user" ? p.user == null : k !== "name" && !isNum(p[k]); }
  function nameCell(p, kid) {
    var lead = p.kind === "session" ? '<i class="mdot m-' + F.esc(p.model || "") + '"></i>' : "";
    var hasKids = p.children && p.children.length;
    var chev = kid ? "" : hasKids ? '<span class="chev' + (open[p.id] ? " open" : "") + '" data-id="' + F.esc(p.id) + '">▶</span>' : '<span class="chev"></span>';
    var dots = p.id === "group:claude-code" && hasKids && !open[p.id] ? '<span class="dots">' + p.children.map(function (k) { return '<i class="mdot m-' + F.esc(k.model || "") + '"></i>'; }).join("") + "</span>" : "";
    return '<div class="nmc">' + chev + lead + '<span class="t">' + F.esc(p.name) + "</span>" + dots + "</div>";
  }
  function rowHtml(p, kid, i) {
    var cls = (kid ? "kid" : "") + (i % 2 ? " odd" : "") + (p.id === selected ? " sel" : "");
    return '<tr data-id="' + F.esc(p.id) + '" class="' + cls + '">' + cols.map(function (c) {
      var tc = (dim(p, c.k) ? "z" : "") + (c.k === "user" ? " u" : "") + (c.k === sortK && c.k !== "name" && c.k !== "user" ? " s" : "");
      return '<td class="' + tc + '">' + (c.k === "name" ? nameCell(p, kid) : cell(p, c.k)) + "</td>";
    }).join("") + "</tr>";
  }
  function renderHead() {
    $("ph").innerHTML = cols.map(function (c) {
      var on = c.k === sortK;
      return '<th data-k="' + c.k + '" class="' + (on ? "on" : "") + '">' + c.t + (on ? '<span class="ar">' + (sortDir < 0 ? "▼" : "▲") + "</span>" : "") + "</th>";
    }).join("");
  }
  // Only the rows in view (plus a margin) are built; spacer rows stand in for the rest.
  // Rebuilding all ~700 rows every 2 s kept thousands of dead DOM nodes waiting on WebKit's GC.
  var ROW_H = 24, kidOf = {};
  function renderRows() {
    if (!snap) return;
    var sc = $("scroll");
    var first = Math.max(0, Math.floor(sc.scrollTop / ROW_H) - 8);
    var last = Math.min(visible.length, Math.ceil((sc.scrollTop + sc.clientHeight) / ROW_H) + 8);
    var out = [];
    if (first) out.push('<tr class="pad" style="height:' + first * ROW_H + 'px"></tr>');
    for (var i = first; i < last; i++) out.push(rowHtml(visible[i], kidOf[visible[i].id], i));
    if (last < visible.length) out.push('<tr class="pad" style="height:' + (visible.length - last) * ROW_H + 'px"></tr>');
    $("pb").innerHTML = out.join("");
  }
  function renderTable() {
    if (!snap) return;
    visible = []; kidOf = {};
    (snap.processes || []).slice().sort(cmp).forEach(function (p) {
      var kids = (p.children || []).filter(match);
      if (!match(p) && !kids.length) return;
      visible.push(p);
      var isOpen = open[p.id] || (query && kids.length);
      if (p.children && p.children.length && isOpen) {
        (query && !match(p) ? kids : p.children).slice().sort(cmp).forEach(function (k) { visible.push(k); kidOf[k.id] = true; });
      }
    });
    renderRows();
    var total = (snap.totals || {}).processes || V.flat(snap.processes).filter(function (p) { return !(p.children && p.children.length); }).length;
    $("pcount").textContent = query ? F.int(visible.length) + " / " + F.int(total) : F.int(total);
    $("q").placeholder = "Search " + F.int(total) + " processes";
    renderQuit();
  }
  function findProc(id) {
    var hit = null;
    if (id) V.flat(snap && snap.processes).some(function (p) { if (p.id === id) { hit = p; return true; } return false; });
    return hit;
  }
  // a process Vitals may ask to quit: has a pid, isn't launchd/kernel, belongs to the user (user null = root or another user)
  function quittable(p) { return p && p.pid != null && p.pid > 1 && p.user != null && p.user !== "root" && p.name !== "Vitals" && p.id !== "group:claude-code"; }
  function renderQuit() {
    var p = findProc(selected), b = $("quitBtn");
    b.hidden = !p;
    if (!p) return;
    var label = quittable(p) ? "Quit " + p.name + "…" : "Quit";
    if (b.textContent !== label) b.textContent = label;
    b.disabled = !quittable(p);
  }
  function selectRow(id, reveal) {
    selected = id;
    var p = findProc(id);
    if (reveal && p) {
      V.flat(snap.processes).forEach(function (g) { if (g.children && g.children.some(function (k) { return k.id === id; })) open[g.id] = true; });
    }
    renderTable();
    if (reveal) showRow(id, "center");
  }
  function showRow(id, how) {
    var i = visible.findIndex(function (p) { return p.id === id; }), sc = $("scroll");
    if (i < 0) return;
    var head = $("ph").offsetHeight, top = i * ROW_H, view = sc.clientHeight - head;
    if (how === "center") sc.scrollTop = Math.max(0, top - view / 2);
    else if (top < sc.scrollTop) sc.scrollTop = top;
    else if (top + ROW_H > sc.scrollTop + view) sc.scrollTop = top + ROW_H - view;
    renderRows();
  }
  // select a row from anywhere (search Enter, or Swift: Vitals.reveal("pid:123")), opening its group
  V.reveal = function (id) { if (snap && findProc(id)) selectRow(id, true); };

  var sr = 0;
  $("scroll").addEventListener("scroll", function () { if (!sr) sr = requestAnimationFrame(function () { sr = 0; renderRows(); }); });
  $("ph").addEventListener("click", function (e) {
    var th = e.target.closest("th"); if (!th) return;
    var k = th.dataset.k;
    if (k === sortK) sortDir = -sortDir; else { sortK = k; sortDir = (k === "name" || k === "user") ? 1 : -1; }
    renderHead(); renderTable();
  });
  $("pb").addEventListener("click", function (e) {
    var c = e.target.closest(".chev[data-id]");
    if (c) { open[c.dataset.id] = !open[c.dataset.id]; renderTable(); return; }
    var tr = e.target.closest("tr[data-id]");
    if (tr) selectRow(tr.dataset.id === selected ? null : tr.dataset.id);
  });
  $("q").addEventListener("input", function (e) { query = e.target.value.trim().toLowerCase(); $("scroll").scrollTop = 0; renderTable(); });

  /* quit, with a sheet that asks first */
  var pending = null;
  function askQuit() {
    var p = findProc(selected);
    if (!quittable(p)) return;
    pending = p;
    $("qTitle").textContent = "Quit " + p.name + "?";
    $("qText").textContent = (p.memBytes ? "This frees about " + F.gbShort(p.memBytes) + ". " : "") + "Anything unsaved in it may be lost.";
    $("veil").hidden = false;
    $("qYes").focus();
  }
  function closeSheet() { $("veil").hidden = true; pending = null; }
  $("quitBtn").addEventListener("click", askQuit);
  $("qNo").addEventListener("click", closeSheet);
  $("veil").addEventListener("click", function (e) { if (e.target === $("veil")) closeSheet(); });
  $("qYes").addEventListener("click", function () {
    if (pending) V.post("quitProcess", { pid: pending.pid, name: pending.name });
    closeSheet();
  });

  /* keyboard */
  document.addEventListener("keydown", function (e) {
    if (!$("veil").hidden) { if (e.key === "Escape") closeSheet(); return; }
    var cmd = e.metaKey, inSearch = document.activeElement === $("q");
    if (cmd && e.key.toLowerCase() === "f") { e.preventDefault(); $("q").focus(); $("q").select(); return; }
    if (cmd && (e.key === "1" || e.key === "2" || e.key === "3")) {
      e.preventDefault(); sortK = { 1: "memBytes", 2: "cpuPct", 3: "energy" }[e.key]; sortDir = -1; renderHead(); renderTable(); return;
    }
    if (cmd && e.key === "Backspace") { e.preventDefault(); askQuit(); return; }
    if (cmd && (e.key === "?" || e.key === "/")) { e.preventDefault(); V.post("openHelp"); return; }
    if (inSearch && e.key === "Escape") { $("q").value = ""; query = ""; $("q").blur(); renderTable(); if (selected) showRow(selected, "center"); return; }
    if (inSearch && e.key === "Enter") {
      e.preventDefault();
      // the first row whose own name matches, else the first match
      var hit = visible.filter(function (p) { return String(p.name).toLowerCase().indexOf(query) >= 0; })[0] || visible.filter(match)[0];
      if (hit) { $("q").blur(); selectRow(hit.id); showRow(hit.id, "center"); }
      return;
    }
    if (inSearch && e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    if (e.key === "Escape" && selected) { selectRow(null); return; }
    var i = visible.findIndex(function (p) { return p.id === selected; });
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (inSearch) $("q").blur();
      var j = e.key === "ArrowDown" ? Math.min(visible.length - 1, i + 1) : Math.max(0, i - 1);
      if (visible[j]) { selectRow(visible[j].id); showRow(visible[j].id, "nearest"); }
    } else if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && selected) {
      var p = findProc(selected);
      if (p && p.children && p.children.length) { e.preventDefault(); open[p.id] = e.key === "ArrowRight"; renderTable(); }
      else if (p && e.key === "ArrowLeft" && kidOf[p.id]) {
        // from a child, Left goes to its group
        var g = (snap.processes || []).filter(function (x) { return (x.children || []).indexOf(p) >= 0; })[0];
        if (g) { e.preventDefault(); selectRow(g.id); showRow(g.id, "nearest"); }
      }
    }
  });

  /* ================= wiring ================= */
  renderHead();
  V.onUpdate(function (s) {
    snap = s;
    drawCharts(s);
    renderReadouts(s);
    renderTable();
    var h = s.host || {};
    var host = [h.model, (h.chip || "").replace(/^Apple /, ""), h.memBytes ? F.gbShort(h.memBytes) : null, h.os].filter(Boolean).join(" · ");
    if ($("host").textContent !== host) $("host").textContent = host;
    var up = h.uptimeSec ? "Up " + F.uptime(h.uptimeSec) : "";
    if ($("footL").textContent !== up) $("footL").textContent = up;
    var right = "Every " + (((s.live || {}).stepSec) || 2) + " s · last 5 min";
    if ($("footR").textContent !== right) $("footR").textContent = right;
  });
  var rz = 0;
  addEventListener("resize", function () {
    if (rz) return;
    rz = requestAnimationFrame(function () { rz = 0; if (snap) { drawCharts(snap); renderRows(); } else layout(); });
  });
})();
</script>
</body>
</html>
